# Canonical CLI contract for gha-indie-worker-mcp-server.rs. flags-2-env parses this at runtime; keep
# option names, defaults and env keys here rather than duplicating them in Rust.
[help]
url = "https://github.com/gha-indie-worker/gha-indie-worker-mcp-server.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[env]
ignore = ["GITHUB_TOKEN"]
